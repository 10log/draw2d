name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build library
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage to Codecov (optional)
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check coverage threshold
      if: matrix.node-version == '20.x'
      run: |
        echo "Checking if coverage meets 30% threshold..."
        npm run test:coverage -- --coverageReporters=json-summary
        COVERAGE=$(node -pe "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct")
        echo "Current line coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < 30" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below 30% threshold"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE}% meets 30% threshold"
        fi
